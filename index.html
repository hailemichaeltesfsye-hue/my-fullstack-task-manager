<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070c18;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent-cyan: #00e5ff;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, #030712 100%) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      color: #f8fafc !important;
      min-height: 100vh;
      padding-bottom: 3rem;
    }
    h2, .text-primary {
      background: linear-gradient(135deg, #00e5ff 0%, #a855f7 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 800 !important;
      letter-spacing: -0.025em;
    }
    .card, form#taskForm, .list-group {
      background: var(--card-bg) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.25) !important;
      border-radius: 16px !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 229, 255, 0.08) !important;
      color: #f1f5f9 !important;
    }
    .card-title, .text-secondary {
      color: #38bdf8 !important;
      font-weight: 600;
    }
    .list-group-item {
      background: rgba(30, 41, 59, 0.6) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 10px !important;
      margin-bottom: 8px !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .list-group-item:hover {
      background: rgba(51, 65, 85, 0.9) !important;
      border-color: rgba(0, 229, 255, 0.5) !important;
      transform: translateX(4px);
    }
    button, .btn, .btn-primary {
      background: linear-gradient(135deg, #00e5ff, #6366f1) !important;
      color: #030712 !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
      border: none !important;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.35);
      transition: all 0.2s ease;
    }
    button:hover, .btn:hover, .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 25px rgba(0, 229, 255, 0.6);
      color: #000 !important;
    }
    input, select, textarea, .form-control {
      background: rgba(3, 7, 18, 0.8) !important;
      border: 1px solid rgba(148, 163, 184, 0.3) !important;
      color: #f8fafc !important;
      border-radius: 10px !important;
    }
    input:focus, select:focus, textarea:focus, .form-control:focus {
      border-color: #00e5ff !important;
      outline: none;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.35) !important;
      color: #fff !important;
    }
  </style>
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4 text-primary fw-bold">Task Manager</h2>
        
        <div class="card p-4 shadow-sm mb-4">
            <form id="taskForm" class="d-flex gap-2">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." required>
                <button type="submit" class="btn btn-primary px-4">Add Task</button>
            </form>
        </div>

        <div class="card p-3 shadow-sm">
            <h5 class="card-title border-bottom pb-2 text-secondary">My Database Tasks</h5>
            <ul id="taskList" class="list-group list-group-flush">
                </ul>
        </div>
    </div>

    <script>
         const API_URL = 'https://my-fullstack-task-manager.onrender.com/api/tasks';
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        // 1. READ ACTION: Fetch rows from the tasks database table on page load
        async function loadTasks() {
            taskList.innerHTML = ''; // Reset UI view
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                
                if (tasks.length === 0) {
                    taskList.innerHTML = `<li class="text-muted text-center py-3">No tasks found in the table. Add one above!</li>`;
                    return;
                }

                // Loop through rows returned by MySQL query array
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center animate-fade-in';
                    li.innerHTML = `
                        <div>
                            <span class="fw-semibold">${task.title}</span>
                            <small class="text-muted d-block" style="font-size: 0.75rem;">Status: ${task.status}</small>
                        </div>
                        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="deleteTask(${task.id})">Delete</button>
                    `;
                    taskList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching data rows from API:', error);
                taskList.innerHTML = `<li class="text-danger text-center py-3">Failed to connect to backend server.</li>`;
            }
        }

        // 2. CREATE ACTION: Capture form submission and POST payload values to MySQL
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskTitle = taskInput.value.trim();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: taskTitle })
                });

                if (response.ok) {
                    taskInput.value = ''; // Clean form control field
                    loadTasks();         // Re-query database to update lists view
                }
            } catch (error) {
                console.error('Error posting item schema data:', error);
            }
        });

        // 3. DELETE ACTION: Send row ID parameter dynamically to clear database record
        async function deleteTask(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { 
                    method: 'DELETE' 
                });
                
                if (response.ok) {
                    loadTasks(); // Update display from database values
                }
            } catch (error) {
                console.error('Error removing item database row entry:', error);
            }
        }

        // Run this initialization block when DOM resources render completely
        loadTasks();
    </script>
</body>
</html>
